name: 🚀 Deploy (Fast Standalone)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  APP_NAME: online-tool-base
  BASE_DIR: /home/opc/apps
  RELEASES_DIR: /home/opc/apps/releases
  CURRENT_LINK: /home/opc/apps/current
  ECOSYSTEM_FILE: /home/opc/apps/ecosystem.config.js

jobs:
  # ============================================================
  # 1. TYPECHECK
  # ============================================================
  typecheck:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_URL: https://www.onlinetoolbase.com

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: 🔍 TypeScript
        run: npm run typecheck

  # ============================================================
  # 2. BUILD PRODUCTION ARTIFACT
  # ============================================================
  build:
    name: 🏗 Build Production Artifact
    needs: typecheck
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_URL: https://www.onlinetoolbase.com
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: 🔎 Verify build dependencies
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Environment"
          echo "========================================"

          echo "Node: $(node --version)"
          echo "NPM:  $(npm --version)"

          echo ""
          echo "========================================"
          echo "TypeScript"
          echo "========================================"

          npm ls typescript

          test -x node_modules/.bin/tsc

          echo "TypeScript version:"
          node -e "console.log(require('typescript').version)"

      - name: 🏗 Build Next.js
        env:
          NODE_ENV: production
        run: npm run build -- --webpack

      - name: 🔎 Validate Next.js standalone output
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validating standalone build"
          echo "========================================"

          test -d .next/standalone
          test -f .next/standalone/server.js
          test -d .next/static

          echo "✅ .next/standalone exists"
          echo "✅ server.js exists"
          echo "✅ .next/static exists"

      - name: 📦 Prepare deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Preparing deployment artifact"
          echo "========================================"

          rm -rf deploy
          mkdir -p deploy/.next

          echo "📦 Copying standalone server..."
          cp -a .next/standalone/. deploy/

          echo "📦 Copying static assets..."
          cp -a .next/static deploy/.next/static

          echo "📦 Copying public assets..."

          if [ -d public ]; then
            cp -a public deploy/public
          fi

          echo ""
          echo "========================================"
          echo "Final artifact validation"
          echo "========================================"

          test -f deploy/server.js
          test -d deploy/.next/static

          if [ -d public ]; then
            test -d deploy/public
          fi

          echo "✅ server.js found"
          echo "✅ .next/static found"

          if [ -d public ]; then
            echo "✅ public directory found"
          fi

          echo ""
          echo "Artifact size:"
          du -sh deploy

      - name: 🗜 Compress deployment artifact
        run: |
          set -euo pipefail

          tar \
            -C deploy \
            -czf release.tar.gz \
            .

          echo "========================================"
          echo "Compressed artifact"
          echo "========================================"

          ls -lh release.tar.gz

      - name: 📤 Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release.tar.gz
          retention-days: 1

  # ============================================================
  # 3. DEPLOY TO OCI
  # ============================================================
  deploy:
    name: 🚀 Deploy to OCI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release

      - name: 🔐 Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: 📦 Generate release ID
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

          echo "Release:"
          echo "$RELEASE_ID"

      - name: 📁 Prepare OCI upload directory
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${BASE_DIR}/incoming/${RELEASE_ID}'"

      - name: 📤 Upload release to OCI
        run: |
          set -euo pipefail

          echo "Uploading release artifact..."

          scp \
            -i ~/.ssh/deploy_key \
            release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${BASE_DIR}/incoming/${RELEASE_ID}/release.tar.gz"

          echo "✅ Upload complete"

      # ========================================================
      # 4. ACTIVATE RELEASE
      # ========================================================
      - name: 🚀 Activate release
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "RELEASE_ID='${RELEASE_ID}' \
             BASE_DIR='${BASE_DIR}' \
             RELEASES_DIR='${RELEASES_DIR}' \
             CURRENT_LINK='${CURRENT_LINK}' \
             ECOSYSTEM_FILE='${ECOSYSTEM_FILE}' \
             APP_NAME='${APP_NAME}' \
             bash -s" <<'EOF'

          set -euo pipefail

          NEW_RELEASE="$RELEASES_DIR/$RELEASE_ID"
          INCOMING="$BASE_DIR/incoming/$RELEASE_ID"
          RELEASE_TARBALL="$INCOMING/release.tar.gz"

          echo "========================================"
          echo "OCI Deployment"
          echo "========================================"

          echo "Release:"
          echo "$RELEASE_ID"

          echo "Target:"
          echo "$NEW_RELEASE"

          # ----------------------------------------------------
          # Safety cleanup on failure
          # ----------------------------------------------------

          cleanup_failed_release() {
            echo ""
            echo "❌ Deployment failed."
            echo "🧹 Cleaning incomplete release..."

            rm -rf "$NEW_RELEASE"

            echo "ℹ️ Existing current release was NOT changed."
          }

          trap cleanup_failed_release ERR

          # ----------------------------------------------------
          # Validate upload
          # ----------------------------------------------------

          if [ ! -f "$RELEASE_TARBALL" ]; then
            echo "❌ Release artifact not found:"
            echo "$RELEASE_TARBALL"
            exit 1
          fi

          # ----------------------------------------------------
          # Validate production environment
          # ----------------------------------------------------

          if [ ! -f "$BASE_DIR/.env" ]; then
            echo "❌ Missing production environment:"
            echo "$BASE_DIR/.env"
            exit 1
          fi

          # ----------------------------------------------------
          # Validate PM2 ecosystem file
          # ----------------------------------------------------

          if [ ! -f "$ECOSYSTEM_FILE" ]; then
            echo "❌ Missing PM2 ecosystem file:"
            echo "$ECOSYSTEM_FILE"
            exit 1
          fi

          # ----------------------------------------------------
          # Create release
          # ----------------------------------------------------

          mkdir -p "$RELEASES_DIR"
          mkdir -p "$NEW_RELEASE"

          echo "📦 Extracting release..."

          tar \
            -xzf "$RELEASE_TARBALL" \
            -C "$NEW_RELEASE"

          # ----------------------------------------------------
          # Validate extracted artifact
          # ----------------------------------------------------

          echo ""
          echo "========================================"
          echo "Release Validation"
          echo "========================================"

          if [ ! -f "$NEW_RELEASE/server.js" ]; then
            echo "❌ server.js missing"
            exit 1
          fi

          if [ ! -d "$NEW_RELEASE/.next/static" ]; then
            echo "❌ .next/static missing"
            exit 1
          fi

          echo "✅ server.js found"
          echo "✅ .next/static found"

          if [ -d "$NEW_RELEASE/public" ]; then
            echo "✅ public directory found"
          fi

          echo ""
          echo "Release size:"
          du -sh "$NEW_RELEASE"

          # ----------------------------------------------------
          # Record previous release
          # ----------------------------------------------------

          PREVIOUS_RELEASE=""

          if [ -L "$CURRENT_LINK" ]; then
            PREVIOUS_RELEASE="$(readlink -f "$CURRENT_LINK" || true)"
          fi

          if [ -n "$PREVIOUS_RELEASE" ]; then
            echo ""
            echo "Previous release:"
            echo "$PREVIOUS_RELEASE"
          else
            echo ""
            echo "No previous release detected."
          fi

          # ----------------------------------------------------
          # Atomic activation
          # ----------------------------------------------------

          echo ""
          echo "🔗 Activating new release..."

          ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

          echo "Current release:"
          readlink -f "$CURRENT_LINK"

          # ----------------------------------------------------
          # Reload PM2
          # ----------------------------------------------------

          echo ""
          echo "🚀 Restarting PM2..."

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            pm2 reload "$ECOSYSTEM_FILE" --update-env
          else
            pm2 start "$ECOSYSTEM_FILE"
          fi

          pm2 save

          # ----------------------------------------------------
          # Local health check
          # ----------------------------------------------------

          echo ""
          echo "========================================"
          echo "Local Health Check"
          echo "========================================"

          HEALTHY=0

          for i in $(seq 1 20); do

            HTTP_CODE="$(
              curl \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                --max-time 5 \
                http://127.0.0.1:3000/ \
                || true
            )"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Local health check passed"
              HEALTHY=1
              break
            fi

            echo "Attempt $i/20 failed: HTTP $HTTP_CODE"

            sleep 2
          done

          # ----------------------------------------------------
          # Automatic rollback
          # ----------------------------------------------------

          if [ "$HEALTHY" -ne 1 ]; then

            echo ""
            echo "❌ New release failed health check."

            if [ -n "$PREVIOUS_RELEASE" ] && \
               [ -d "$PREVIOUS_RELEASE" ]; then

              echo "↩️ Rolling back..."
              echo "$PREVIOUS_RELEASE"

              ln -sfn \
                "$PREVIOUS_RELEASE" \
                "$CURRENT_LINK"

              pm2 reload \
                "$ECOSYSTEM_FILE" \
                --update-env \
                || pm2 restart "$APP_NAME"

              pm2 save

              echo "⏳ Checking rollback..."

              for i in $(seq 1 15); do

                HTTP_CODE="$(
                  curl \
                    -s \
                    -o /dev/null \
                    -w "%{http_code}" \
                    --max-time 5 \
                    http://127.0.0.1:3000/ \
                    || true
                )"

                if [ "$HTTP_CODE" = "200" ]; then
                  echo "✅ Rollback successful"
                  break
                fi

                echo "Rollback attempt $i/15 failed"

                sleep 2
              done

            else
              echo "⚠️ No previous release available for rollback."
            fi

            rm -rf "$NEW_RELEASE"
            rm -rf "$INCOMING"

            exit 1
          fi

          # ----------------------------------------------------
          # Cleanup upload
          # ----------------------------------------------------

          echo ""
          echo "🧹 Removing temporary upload..."

          rm -rf "$INCOMING"

          # ----------------------------------------------------
          # Keep last 3 releases
          # ----------------------------------------------------

          echo ""
          echo "🧹 Cleaning old releases..."

          cd "$RELEASES_DIR"

          ls -dt -- */ 2>/dev/null \
            | tail -n +4 \
            | xargs -r rm -rf

          # ----------------------------------------------------
          # Final PM2 status
          # ----------------------------------------------------

          echo ""
          echo "========================================"
          echo "PM2 Status"
          echo "========================================"

          pm2 status "$APP_NAME"

          echo ""
          echo "========================================"
          echo "Active Release"
          echo "========================================"

          readlink -f "$CURRENT_LINK"

          echo ""
          echo "========================================"
          echo "Deployment Complete"
          echo "========================================"

          EOF

      # ========================================================
      # 5. EXTERNAL HEALTH CHECK
      # ========================================================
      - name: 🌐 External Health Check
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Production Health Check"
          echo "========================================"

          for i in $(seq 1 12); do

            HTTP="$(
              curl \
                -L \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                --max-time 15 \
                "${{ secrets.SITE_URL }}" \
                || true
            )"

            if [ "$HTTP" = "200" ]; then
              echo "✅ Production site is healthy"
              exit 0
            fi

            echo "Attempt $i/12 returned HTTP $HTTP"

            sleep 5
          done

          echo "❌ Production health check failed"

          exit 1

      # ========================================================
      # 6. INDEXNOW
      # ========================================================
      - name: 📣 Notify IndexNow
        if: success()
        run: |
          set -euo pipefail

          echo "📣 Notifying IndexNow..."

          curl \
            --fail-with-body \
            --max-time 30 \
            -X POST \
            "${{ secrets.SITE_URL }}/api/indexnow" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INDEXNOW_API_SECRET }}" \
            -d '{"mode":"full-site"}' \
            || echo "⚠️ IndexNow notification failed; deployment remains successful."
