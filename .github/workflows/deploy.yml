name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd /home/opc/online-tool-base
            git pull origin main
            npm ci
            if npm run build; then
              pm2 restart online-tool-base --update-env
              echo "✅ Deploy successful"
            else
              echo "❌ Build failed — PM2 not restarted, site still serving previous build"
              exit 1
            fi

      # ── Wait for server to be ready after PM2 restart ───────────────────────
      # PM2 restart is async — Next.js takes a few seconds to boot and bind.
      # Without this, the IndexNow curl hits nginx before the Node process is
      # listening and gets a 502. We poll the homepage every 5s for up to 60s.
      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to come online..."
          for i in $(seq 1 12); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SITE_URL }}")
            if [ "$HTTP" = "200" ]; then
              echo "✅ Server ready (HTTP 200) after $((i * 5))s"
              exit 0
            fi
            echo "  attempt $i/12 — got HTTP $HTTP, retrying in 5s..."
            sleep 5
          done
          echo "⚠️  Server did not respond with 200 after 60s — proceeding anyway"

      # ── IndexNow: notify search engines after successful deploy ──────────────
      # Runs on the GitHub Actions runner (not the OCI server) — no SSH needed.
      # Only fires if the deploy step above succeeded (default behaviour).
      # INDEXNOW_API_SECRET must be added to GitHub → Settings → Secrets.
      - name: Submit URLs to IndexNow
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.SITE_URL }}/api/indexnow" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INDEXNOW_API_SECRET }}" \
            -d '{"mode": "all-tools"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ IndexNow: submitted successfully"
          else
            echo "⚠️  IndexNow: submission returned HTTP $HTTP_CODE — deploy still succeeded"
            # Note: we exit 0 here intentionally.
            # A failed IndexNow submission should never fail the deployment.
          fi