name: 🚀 Deploy (OCI Optimized)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 120m

          script: |
            set -e

            BASE_DIR="/home/opc/apps"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            SHARED_DIR="$BASE_DIR/shared"

            NEW_RELEASE="$RELEASES_DIR/$(date +%Y%m%d%H%M%S)"

            echo "📁 Preparing directories..."
            mkdir -p $RELEASES_DIR
            mkdir -p $SHARED_DIR

            echo "📦 Creating new release..."
            mkdir -p $NEW_RELEASE

            echo "📥 Cloning repo..."
            git clone --depth=1 git@github.com:JimmyAyivor/online-toolbase.git $NEW_RELEASE

            cd $NEW_RELEASE

            echo "📦 Installing dependencies (lean mode)..."
            npm ci --omit=dev --no-audit --no-fund --legacy-peer-deps

            echo "⚙️ Setting environment..."
            export NODE_OPTIONS="--max-old-space-size=2048"
            export NEXT_PRIVATE_BUILD_WORKERS=$(nproc)
            export NEXT_DISABLE_TURBOPACK=1
            export NEXT_PUBLIC_BASE_URL="${{ secrets.NEXT_PUBLIC_BASE_URL }}"

            echo "🏗 Building app..."
            npm run build

            echo "🧹 Cleaning npm cache..."
            rm -rf ~/.npm

            # OPTIONAL: DB migrations (uncomment if needed)
            # npx prisma migrate deploy

            echo "🔗 Switching to new release..."
            ln -sfn $NEW_RELEASE $CURRENT_LINK

            echo "🚀 Starting or reloading app..."
            if pm2 describe online-tool-base > /dev/null 2>&1; then
              pm2 reload online-tool-base --update-env
            else
              pm2 start npm --name online-tool-base -- start --cwd $CURRENT_LINK
            fi

            pm2 save

            echo "🧹 Cleaning old releases (keep 3)..."
            cd $RELEASES_DIR
            ls -dt */ | tail -n +4 | xargs -r rm -rf

      - name: Health Check + Auto Rollback
        run: |
          echo "⏳ Checking site health..."

          for i in $(seq 1 12); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SITE_URL }}")

            if [ "$HTTP" = "200" ]; then
              echo "✅ App is healthy"
              exit 0
            fi

            echo "Attempt $i failed (HTTP $HTTP)... retrying"
            sleep 5
          done

          echo "❌ Health check failed — rolling back..."

          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            BASE_DIR="/home/opc/apps"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"

            PREVIOUS=$(ls -dt $RELEASES_DIR/* | sed -n '2p')

            if [ -z "$PREVIOUS" ]; then
              echo "No previous release found — cannot rollback"
              exit 1
            fi

            echo "↩️ Rolling back to $PREVIOUS"
            ln -sfn $PREVIOUS $CURRENT_LINK

            pm2 reload online-tool-base
            pm2 save
          EOF

          exit 1

      - name: Submit to IndexNow
        run: |
          echo "📡 Submitting IndexNow..."

          curl -X POST "${{ secrets.SITE_URL }}/api/indexnow" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INDEXNOW_API_SECRET }}" \
            -d '{"mode":"all-tools"}' || true