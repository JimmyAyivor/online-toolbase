name: 🚀 Deploy (OCI Optimized)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    name: 🔨 Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 🔍 TypeScript
        run: npm run typecheck

      - name: 🏗 Build Next.js
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_DISABLE_TURBOPACK: "1"
        run: npm run build

      - name: 📦 Prepare production artifact
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp -a .next/standalone/. release/

          mkdir -p release/.next
          cp -a .next/static release/.next/static

          if [ -d public ]; then
            cp -a public release/public
          fi

          tar -czf release.tar.gz -C release .

          echo "📦 Artifact size:"
          du -h release.tar.gz

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: 🚀 Deploy to OCI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release

      - name: 📤 Upload release to OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /tmp

      - name: 🚀 Activate release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m

          script: |
            set -euo pipefail

            BASE_DIR="/home/opc/apps"
            RELEASES_DIR="$BASE_DIR/releases"
            CURRENT_LINK="$BASE_DIR/current"
            TMP_RELEASE="/tmp/release.tar.gz"

            RELEASE_ID="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA:-manual}"
            NEW_RELEASE="$RELEASES_DIR/$RELEASE_ID"

            mkdir -p "$RELEASES_DIR"
            mkdir -p "$NEW_RELEASE"

            trap '
              echo "❌ Deployment failed."
              rm -rf "$NEW_RELEASE"
              rm -f "$TMP_RELEASE"
            ' ERR

            echo "📦 Extracting release..."
            tar -xzf "$TMP_RELEASE" -C "$NEW_RELEASE"

            rm -f "$TMP_RELEASE"

            echo "🔗 Switching release atomically..."
            ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

            echo "🚀 Restarting PM2..."

            cd "$CURRENT_LINK"

            if pm2 describe online-tool-base > /dev/null 2>&1; then
              pm2 reload "$CURRENT_LINK/ecosystem.config.js" --update-env
            else
              pm2 start "$CURRENT_LINK/ecosystem.config.js"
            fi

            pm2 save

            echo "🧹 Cleaning old releases..."

            cd "$RELEASES_DIR"

            find . \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' |
              sort -nr |
              tail -n +4 |
              cut -d' ' -f2- |
              xargs -r rm -rf

            echo "✅ Release activated:"
            echo "$NEW_RELEASE"

      - name: 🏥 Health Check + Auto Rollback
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          INDEXNOW_API_SECRET: ${{ secrets.INDEXNOW_API_SECRET }}
        run: |
          set -euo pipefail

          echo "⏳ Waiting for application..."

          HEALTHY=false

          for i in $(seq 1 18); do
            HTTP=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 10 \
              "$SITE_URL" || true)

            if [ "$HTTP" = "200" ]; then
              echo "✅ App is healthy"
              HEALTHY=true
              break
            fi

            echo "Attempt $i failed (HTTP $HTTP)..."
            sleep 5
          done

          if [ "$HEALTHY" = true ]; then
            echo "📡 Triggering IndexNow..."

            curl \
              --silent \
              --show-error \
              --max-time 30 \
              -X POST \
              "$SITE_URL/api/indexnow" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $INDEXNOW_API_SECRET" \
              -d '{"mode":"full-site"}' \
              || true

            exit 0
          fi

          echo "❌ Health check failed."
          echo "↩️ Rolling back..."

          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh \
            -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" << 'EOF'
          set -euo pipefail

          BASE_DIR="/home/opc/apps"
          RELEASES_DIR="$BASE_DIR/releases"
          CURRENT_LINK="$BASE_DIR/current"

          CURRENT="$(readlink -f "$CURRENT_LINK" || true)"

          PREVIOUS="$(
            find "$RELEASES_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%T@ %p\n' |
              sort -nr |
              awk '{print $2}' |
              while read -r RELEASE; do
                if [ "$RELEASE" != "$CURRENT" ]; then
                  echo "$RELEASE"
                  break
                fi
              done
          )"

          if [ -z "$PREVIOUS" ]; then
            echo "❌ No previous release available."
            exit 1
          fi

          echo "↩️ Rolling back to:"
          echo "$PREVIOUS"

          ln -sfn "$PREVIOUS" "$CURRENT_LINK"

          cd "$CURRENT_LINK"

          pm2 reload "$CURRENT_LINK/ecosystem.config.js" \
            --update-env \
            || pm2 restart online-tool-base

          pm2 save

          echo "✅ Rollback completed."
          EOF

          rm -f /tmp/deploy_key

          exit 1
