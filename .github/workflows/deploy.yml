name: 🚀 Deploy (Fast Standalone)

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20
  APP_NAME: online-tool-base
  BASE_DIR: /home/opc/apps
  RELEASES_DIR: /home/opc/apps/releases
  CURRENT_LINK: /home/opc/apps/current
  ECOSYSTEM_FILE: /home/opc/apps/ecosystem.config.js

jobs:
  typecheck:
    name: 🔍 TypeScript Check
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_URL: https://www.onlinetoolbase.com

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 🔍 TypeScript
        run: npm run typecheck

  build:
    name: 🏗 Build Production Artifact
    needs: typecheck
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_BASE_URL: https://www.onlinetoolbase.com
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: 🏗 Build Next.js
        run: npm run build -- --webpack

      - name: 📦 Prepare standalone artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy/.next

          echo "📦 Copying standalone server..."
          cp -a .next/standalone/. deploy/

          echo "📦 Copying static assets..."
          cp -a .next/static deploy/.next/static

          echo "📦 Copying public assets..."
          if [ -d public ]; then
            cp -a public deploy/public
          fi

          echo "🔎 Validating artifact..."

          test -f deploy/server.js
          test -d deploy/.next/static

          if [ -d public ]; then
            test -d deploy/public
          fi

          echo "✅ Standalone artifact validated"

          echo "📊 Artifact size:"
          du -sh deploy

          echo "📁 Artifact contents:"
          find deploy -maxdepth 2 -type f | head -50

      - name: 🗜 Compress artifact
        run: |
          tar -C deploy -czf release.tar.gz .

          echo "📦 Compressed artifact:"
          ls -lh release.tar.gz

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: 🚀 Deploy to OCI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: production-release

      - name: 🔐 Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: 📤 Upload release to OCI
        run: |
          set -euo pipefail

          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${BASE_DIR}/incoming/${RELEASE_ID}'"

          scp \
            -i ~/.ssh/deploy_key \
            release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${BASE_DIR}/incoming/${RELEASE_ID}/release.tar.gz"

      - name: 🚀 Activate release
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "RELEASE_ID='${RELEASE_ID}' \
             BASE_DIR='${BASE_DIR}' \
             RELEASES_DIR='${RELEASES_DIR}' \
             CURRENT_LINK='${CURRENT_LINK}' \
             ECOSYSTEM_FILE='${ECOSYSTEM_FILE}' \
             APP_NAME='${APP_NAME}' \
             bash -s" <<'EOF'

          set -euo pipefail

          NEW_RELEASE="$RELEASES_DIR/$RELEASE_ID"
          INCOMING="$BASE_DIR/incoming/$RELEASE_ID"
          RELEASE_TARBALL="$INCOMING/release.tar.gz"

          echo "📦 Preparing release:"
          echo "$NEW_RELEASE"

          trap '
            echo "❌ Deployment failed."
            echo "🧹 Cleaning incomplete release..."
            rm -rf "$NEW_RELEASE"
          ' ERR

          mkdir -p "$RELEASES_DIR"
          mkdir -p "$BASE_DIR/incoming"

          if [ ! -f "$RELEASE_TARBALL" ]; then
            echo "❌ Release artifact not found:"
            echo "$RELEASE_TARBALL"
            exit 1
          fi

          echo "📦 Extracting release..."

          mkdir -p "$NEW_RELEASE"

          tar \
            -xzf "$RELEASE_TARBALL" \
            -C "$NEW_RELEASE"

          echo "🔎 Validating release..."

          test -f "$NEW_RELEASE/server.js"
          test -d "$NEW_RELEASE/.next/static"

          if [ -d "$NEW_RELEASE/public" ]; then
            echo "✅ public directory found"
          fi

          echo "✅ Release validation passed"

          echo "🔐 Validating production environment..."

          if [ ! -f "$BASE_DIR/.env" ]; then
            echo "❌ Missing production environment:"
            echo "$BASE_DIR/.env"
            exit 1
          fi

          if [ ! -f "$ECOSYSTEM_FILE" ]; then
            echo "❌ Missing PM2 ecosystem file:"
            echo "$ECOSYSTEM_FILE"
            exit 1
          fi

          echo "🔗 Activating release atomically..."

          ln -sfn "$NEW_RELEASE" "$CURRENT_LINK"

          echo "📂 Current release:"
          readlink -f "$CURRENT_LINK"

          echo "🚀 Restarting PM2..."

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            pm2 reload "$ECOSYSTEM_FILE" --update-env
          else
            pm2 start "$ECOSYSTEM_FILE"
          fi

          pm2 save

          echo "⏳ Waiting for application..."

          for i in $(seq 1 20); do
            if curl -fsS \
              --max-time 5 \
              http://127.0.0.1:3000/ \
              > /dev/null; then

              echo "✅ Local application health check passed"
              break
            fi

            if [ "$i" -eq 20 ]; then
              echo "❌ Local health check failed"
              exit 1
            fi

            echo "Attempt $i failed..."
            sleep 2
          done

          echo "🧹 Removing temporary upload..."

          rm -rf "$INCOMING"

          echo "🧹 Cleaning old releases..."

          cd "$RELEASES_DIR"

          ls -dt -- */ 2>/dev/null \
            | tail -n +4 \
            | xargs -r rm -rf

          echo "📋 Active releases:"
          ls -lah "$RELEASES_DIR"

          echo "✅ OCI deployment completed"

          EOF

      - name: 🌐 External Health Check
        run: |
          set -euo pipefail

          echo "⏳ Checking production site..."

          for i in $(seq 1 12); do
            HTTP=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 15 \
              "${{ secrets.SITE_URL }}")

            if [ "$HTTP" = "200" ]; then
              echo "✅ Production site is healthy"
              exit 0
            fi

            echo "Attempt $i failed with HTTP $HTTP..."
            sleep 5
          done

          echo "❌ Production health check failed"
          exit 1

      - name: 📣 IndexNow
        if: success()
        run: |
          curl \
            -X POST \
            "${{ secrets.SITE_URL }}/api/indexnow" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.INDEXNOW_API_SECRET }}" \
            -d '{"mode":"full-site"}' \
            || true
